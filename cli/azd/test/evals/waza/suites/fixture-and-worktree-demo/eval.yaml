schemaVersion: "2.0"
name: fixture-and-worktree-demo
scenario: azure-dev-vally-migration
description: |-
  Demonstration of vally features: - Copies fixture data into a workspace - Uses a worktree of this repo as the workspace base - Shows the most common grader types:
    - a prompt-based LLM judge
    - a file-exists check
    - an output-contains literal match
    - an output-matches regex match
    - a custom program grader
config:
  executor: copilot-sdk
  model: claude-sonnet-5
  judge_model: gpt-5.6-terra
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  inject_skill_body: false
  skill_directories: []
  disabled_skills:
    - "*"
metrics:
  - name: task_completion
    weight: 1
    threshold: 1
    description: Native strict grader verdict; original suite thresholds are reported separately.
tasks:
  - tasks\fixture-notes-summary.yaml
