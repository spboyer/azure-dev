schemaVersion: "2.0"
name: azd-qna
scenario: azure-dev-vally-migration
description: These are some simple 'ask copilot about azd' questions or errors, but don't involve using real azd projects, MCPs, or the CLI. Gives us a general idea of what the state of the models are with regards to built-in azd knowledge.
config:
  executor: copilot-sdk
  model: gpt-5.6-terra
  judge_model: gpt-5.6-luna
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  inject_skill_body: false
  skill_directories: []
  disabled_skills:
    - "*"
metrics:
  - name: task_completion
    weight: 1
    threshold: 1
    description: Native strict grader verdict; original suite thresholds are reported separately.
tasks:
  - tasks\troubleshoot-auth-error.yaml
  - tasks\troubleshoot-config-error.yaml
