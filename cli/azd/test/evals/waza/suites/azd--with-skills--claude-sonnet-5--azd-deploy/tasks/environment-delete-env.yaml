id: environment-delete-env
name: environment-delete-env
inputs:
  prompt: I have a dev environment that I no longer need. How do I completely remove it and all its Azure resources?
  files:
    - path: azure.yaml
      content: "name: sample-app\r\nmetadata:\r\n  template: sample-app@0.0.1\r\nservices:\r\n  web:\r\n    project: ./src/web\r\n    host: appservice\r\n    language: js\r\n"
    - path: .azure/config.json
      content: "{\r\n    \"defaultEnvironment\": \"dev\"\r\n}\r\n"
    - path: .azure/dev/.env
      content: "AZURE_ENV_NAME=\"dev\"\r\nAZURE_LOCATION=\"eastus2\"\r\nAZURE_SUBSCRIPTION_ID=\"00000000-0000-0000-0000-000000000000\"\r\nAZURE_RESOURCE_GROUP=\"rg-sample-dev\"\r\n"
graders:
  - type: program
    name: recommends azd down to remove Azure resources
    config:
      command: node
      args:
        - graders\vally-check.mjs
        - '{"type":"output-matches","name":"recommends azd down to remove Azure resources","config":{"pattern":"azd down"}}'
      timeout: 30
  - type: program
    name: recommends azd env remove for local cleanup
    config:
      command: node
      args:
        - graders\vally-check.mjs
        - '{"type":"output-matches","name":"recommends azd env remove for local cleanup","config":{"pattern":"azd env remove"}}'
      timeout: 30
  - type: prompt
    name: "judge: removes local environment after tearing down resources, without creating a new one"
    config:
      mode: independent
      continue_session: false
      prompt: |-
        Judge the recorded agent work, not the quality of these evaluation instructions.

        Use the supplied recorded task, final output, and conversation/tool evidence. Do not execute commands or change files.

        1. Recommends azd down to remove Azure resources

        2. Recommends azd env remove to remove the local environment, after azd down

        Call exactly one of set_waza_grade_pass or set_waza_grade_fail once, with a specific explanation.
      evidence_context: {}
