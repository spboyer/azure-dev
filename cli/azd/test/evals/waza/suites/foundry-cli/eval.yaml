schemaVersion: "2.0"
name: foundry-cli
scenario: azure-dev-vally-migration
description: Can an agent discover the Foundry CLI surface, diagnose a broken project with it, and stay away from destructive commands while doing read-only work?
config:
  executor: copilot-sdk
  model: gpt-5.6-terra
  judge_model: gpt-5.6-luna
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  inject_skill_body: false
  skill_directories: []
  disabled_skills:
    - "*"
metrics:
  - name: task_completion
    weight: 1
    threshold: 1
    description: Native strict grader verdict; original suite thresholds are reported separately.
tasks:
  - tasks\discover-command-surface.yaml
  - tasks\diagnose-broken-project.yaml
