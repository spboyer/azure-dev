id: environment-create-staging
name: environment-create-staging
inputs:
  prompt: |
    I have my app deployed in production, but I want to test changes in a
    separate setup called staging before they go live. What's the best way
    to set that up?
  files:
    - path: azure.yaml
      content: "name: sample-app\r\nmetadata:\r\n  template: sample-app@0.0.1\r\nservices:\r\n  web:\r\n    project: ./src/web\r\n    host: appservice\r\n    language: js\r\n"
    - path: .azure/config.json
      content: "{\r\n    \"defaultEnvironment\": \"production\"\r\n}\r\n"
    - path: .azure/production/.env
      content: "AZURE_ENV_NAME=\"production\"\r\nAZURE_LOCATION=\"eastus2\"\r\nAZURE_SUBSCRIPTION_ID=\"00000000-0000-0000-0000-000000000000\"\r\nAZURE_RESOURCE_GROUP=\"rg-sample-production\"\r\n"
graders:
  - type: program
    name: Talks about azd env new
    config:
      command: node
      args:
        - graders\vally-check.mjs
        - '{"type":"output-matches","name":"Talks about azd env new","config":{"pattern":"azd env new"}}'
      timeout: 30
  - type: prompt
    name: "judge: creates staging without destructive or redundant steps"
    config:
      mode: independent
      continue_session: false
      prompt: |-
        Judge the recorded agent work, not the quality of these evaluation instructions.

        Use the supplied recorded task, final output, and conversation/tool evidence. Do not execute commands or change files.

        1. Suggests azd env new (or equivalent) to create a separate staging environment

        2. Does not recommend tearing down production or running azd init for the existing project

        Call exactly one of set_waza_grade_pass or set_waza_grade_fail once, with a specific explanation.
      evidence_context: {}
